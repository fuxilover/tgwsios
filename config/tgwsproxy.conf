# tgwsproxyd config
# Local SOCKS5 port that Telegram should be pointed at (Settings ->
# Data and Storage -> Proxy -> Add Proxy -> SOCKS5, server 127.0.0.1).
PORT=1080

# Which WS host to bridge to per Telegram datacenter id. Only DC2/DC4
# are known to reliably speed things up (see upstream tg-ws-proxy docs);
# everything else falls back to plain direct TCP automatically.
DC_HOST_1=pluto.web.telegram.org
DC_HOST_2=venus.web.telegram.org
DC_HOST_3=aurora.web.telegram.org
DC_HOST_4=vesta.web.telegram.org
DC_HOST_5=flora.web.telegram.org

# Map of Telegram DC IPs -> DC id. Add more IPs (comma separated) if
# your account gets assigned different DC IPs in its proxy settings.
DC_IP_2=149.154.167.51,149.154.167.220
DC_IP_4=149.154.167.91

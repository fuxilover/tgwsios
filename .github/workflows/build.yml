name: Build TG WS Proxy tweak

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    # Theos itself only really needs the toolchain + iOS SDK, which the
    # theos-action below fetches - macOS runner is required because the
    # packaging step (ldid, dpkg-deb) is set up for it out of the box.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          # We only build a plain Tool + Logos tweak, no Swift/extra libs needed.
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'

      - name: Build rootful package
        run: make clean package FINALPACKAGE=1

      - name: Build rootless package (roothide / Dopamine / palera1n rootless)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgwsproxy-debs
          path: packages/*.deb
          if-no-files-found: error

  # Optional: attach the .debs to a GitHub Release when you push a tag
  # like "v1.0.0". Remove this job if you don't want releases.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tgwsproxy-debs
          path: packages

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
